name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets (verified only)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build & validate glossary
        run: python i18n/build.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Apply migrations (sqlite)
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - name: Run tests
        run: pytest -q
